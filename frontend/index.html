<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="OpenHealth is an independent, education-first project making healthcare learning easier to reach. It hosts eQalb, an illustrative health technology assessment teaching simulator."
    />
    <title>OpenHealth — accessible, practical health learning</title>
    <script>
      // Applied before the first paint so a stored dark theme does not flash light.
      try {
        var stored = localStorage.getItem('eqalb.theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light')
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
