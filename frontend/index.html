<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta
      name="description"
      content="eQalb is an interactive introduction to health-economic modelling from OpenHealth: an illustrative teaching tool whose inputs and outputs are simulated, not clinical evidence."
    />
    <title>OpenHealth</title>
    <script>
      // Applied before the first paint so the app's theme never flashes. The app is
      // dark unless the visitor has explicitly chosen light (or dark) with the theme
      // button; the operating system's preference is not consulted, and a browser
      // that refuses storage is simply dark. useTheme.ts follows the same rule.
      var appTheme = 'dark'
      try {
        var stored = localStorage.getItem('eqalb.theme')
        if (stored === 'light' || stored === 'dark') appTheme = stored
      } catch (error) {
        /* no readable preference: the default stands */
      }
      document.documentElement.dataset.theme = appTheme

      try {
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches

        // The landing page keeps its own theme, under its own key, and only "/app"
        // (the whole eQalb application) and "/about" are not landing addresses.
        // This attribute is what landing.css keys the landing palette and its page
        // rules on; useLandingTheme.ts owns it from mount on, and removes it again
        // when that page unmounts, so the app never sees it.
        var path = window.location.pathname.replace(/\/+$/, '')
        if (path !== '/app' && path !== '/about') {
          var landing = localStorage.getItem('openhealth.landing.theme')
          document.documentElement.dataset.landingTheme = landing || (prefersDark ? 'dark' : 'light')
        }
      } catch (error) {
        /* the landing page applies its own theme when it mounts */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
